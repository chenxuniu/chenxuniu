<svg xmlns="http://www.w3.org/2000/svg" width="640" height="292" viewBox="0 0 640 292" role="img" aria-labelledby="title description">
  <title id="title">Chenxu Niu — HPC, AI inference, and GPU energy efficiency</title>
  <desc id="description">A terminal transcript introducing Chenxu Niu, Solutions Architect at NVIDIA, and research at NeurIPS 2026, ICCAD 2026, and AAAI 2026.</desc>
  <style>
