    @keyframes line4 { 0%, 29% { opacity: 0; } 33%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes line5 { 0%, 41% { opacity: 0; } 45%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes line6 { 0%, 49% { opacity: 0; } 53%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
